[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marlio"
version = "0.1.0"
description = "Super Mario Bros. solved by learning algorithms, starting with a Python MarI/O"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gym-super-mario-bros>=9.1.0",
    "nes-py>=9.0.1",
    "gymnasium>=1.0.0",
    "numpy",
    "pillow>=12.3.0",
    "imageio-ffmpeg>=0.6.0",
]

[project.optional-dependencies]
# Real NES sound in recordings (play_neat.py --sound). Large (~250 MB: it
# ships emulators for many consoles), so it's optional.
sound = ["stable-retro>=1.0.1"]

[dependency-groups]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
include = ["marlio*"]

[tool.uv]
# nes-py caps pyglet at 1.5.21 and stable-retro needs 1.5.27 or newer; both
# work with the last 1.5 release (tested: the nes-py game window and
# stable-retro), so use that.
override-dependencies = ["pyglet>=1.5.27,<2"]
